server:
  port: 8080
  servlet:
    # 请求路径前缀
    context-path: /api
mybatis-plus:
  configuration:
    # 下划线映射驼峰
    map-underscore-to-camel-case: false
    # 开启sql日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-field: isDeleted
      # 逻辑已删除值(默认为 1)
      logic-delete-value: 1
      # 逻辑未删除值(默认为 0)
      logic-not-delete-value: 0
  # 如果mapper文件夹不放在resource目录下那么需要指定xml文件所在位置
  # 两种指定mapper.xml文件的位置，如果文件在默认的resource目录下，那么不用指定
  # 这种写法繁琐
  # mapper-locations: classpath*:com/llj/usercenter/mapper/xml/*.xml
  # 这种写法不安全，效率低
  # mapper-locations: classpath*:**/xml/*.xml


